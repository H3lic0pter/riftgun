plugins {
    id 'java'
    id 'net.neoforged.gradle.userdev' version '7.0.182'
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        name = 'Jared Maven'
        url = 'https://maven.blamejared.com'
        content { includeGroup 'mezz.jei' }
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${neoforge_version}"
    compileOnly "maven.modrinth:reCfnRvJ:tApwsw9C"
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-1.21.1-neoforge:${jei_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.2'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

runs {
    configureEach {
        systemProperty 'forge.logging.console.level', 'debug'
        modSource sourceSets.main
    }

    client {
        systemProperty 'riftgun.guiCapture', providers.gradleProperty('guiCapture').orElse('false').get()
        systemProperty 'riftgun.guiCaptureScale', providers.gradleProperty('guiCaptureScale').orElse('0').get()
    }
    server {
        arguments.add '--nogui'
    }
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
        minecraft_version: minecraft_version,
        neoforge_version: neoforge_version,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_version: mod_version
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
