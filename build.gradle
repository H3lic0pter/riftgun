plugins {
    id 'java'
    id 'net.neoforged.gradle.userdev' version '7.0.182'
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        name = 'Jared Maven'
        url = 'https://maven.blamejared.com'
        content { includeGroup 'mezz.jei' }
    }
}

configurations {
    optionalClientCompileOnly
    optionalClientRuntimeOnly
    compileOnly.extendsFrom(optionalClientCompileOnly)
    runtimeOnly.extendsFrom(optionalClientRuntimeOnly)
}

dependencies {
    implementation "net.neoforged:neoforge:${neoforge_version}"
    optionalClientCompileOnly "maven.modrinth:${ryoamiclights_modrinth_project_id}:${ryoamiclights_modrinth_version_id}"
    optionalClientCompileOnly "mezz.jei:jei-1.21.1-neoforge-api:${jei_version}"
    // Present only in development runs; optional client integrations are never bundled.
    optionalClientRuntimeOnly "mezz.jei:jei-1.21.1-neoforge:${jei_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.9.2'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

// Ship the project license inside the JAR so it is discoverable from the distribution.
tasks.named('jar', Jar).configure {
    from(rootProject.file('LICENSE')) {
        into 'META-INF'
        rename { 'LICENSE' }
    }
}

runs {
    configureEach {
        systemProperty 'forge.logging.console.level', 'debug'
        modSource sourceSets.main
    }

    client {
        systemProperty 'riftgun.guiCapture', providers.gradleProperty('guiCapture').orElse('false').get()
        systemProperty 'riftgun.guiCaptureScale', providers.gradleProperty('guiCaptureScale').orElse('0').get()
    }
    server {
        arguments.add '--nogui'
    }
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
        minecraft_version: minecraft_version,
        neoforge_version: neoforge_version,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_version: mod_version
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xlint:deprecation', '-Xlint:removal'])
}

tasks.register('verifyReleaseJar') {
    dependsOn tasks.named('jar')
    group = 'verification'
    description = 'Verifies optional client dependencies are not bundled into the release JAR.'
    doLast {
        def archive = tasks.named('jar', Jar).get().archiveFile.get().asFile
        def forbiddenPrefixes = [
            'mezz/jei/',
            'org/thinkingstudio/ryoamiclights/',
            'org/thinkingstudio/obsidianui/',
            'assets/jei/',
            'assets/ryoamiclights/',
            'assets/obsidianui/',
            'META-INF/jarjar/'
        ]
        def bundled = zipTree(archive).matching {
            forbiddenPrefixes.each { prefix -> include "${prefix}**" }
        }.files
        if (!bundled.empty) {
            throw new GradleException("Optional client dependencies were bundled: ${bundled}")
        }
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('verifyReleaseJar')
}
