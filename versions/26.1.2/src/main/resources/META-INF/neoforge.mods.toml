modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://github.com/H3lic0pter/riftgun/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "H3lic0pter"
displayURL = "https://github.com/H3lic0pter/riftgun"
logoFile = "icon.png"
description = '''Create linked walk-through portals for local and cross-dimensional travel, with saved destinations, configurable placement, portal fuels, modules, player privacy, and client-side visual and sound themes.'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[26.1.2,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "jei"
type = "optional"
versionRange = "[19.21,)"
ordering = "NONE"
side = "CLIENT"
