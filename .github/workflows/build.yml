name: Build

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build and verify release JAR
        run: |
          chmod +x gradlew
          ./gradlew clean build --warning-mode all
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: riftgun
          path: build/libs/riftgun-*.jar
          if-no-files-found: error
