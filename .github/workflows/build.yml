name: Build

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # One entry per supported Minecraft version. Uncomment and add a
          # Java version when a new node is enabled in versions/.
          - version: 1.21.1
            java: '21'
          # - version: 26.1.2
          #   java: '25'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle
      - name: Build and verify release JAR (${{ matrix.version }})
        run: |
          chmod +x gradlew
          ./gradlew clean build --warning-mode all
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: riftgun-${{ matrix.version }}
          path: versions/${{ matrix.version }}/build/libs/riftgun-*.jar
          if-no-files-found: error
